name: release

# A `vX.Y.Z` tag publishes the GitHub Release with the skill zip, only when
# the tag, the plugin manifest and `skill/VERSION` agree and the suite passes.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"
      - name: Check version agreement
        run: python scripts/release.py check "$GITHUB_REF_NAME"
      - name: Test
        run: python -m unittest -v
      - name: Build the skill zip
        id: build
        run: echo "zip=$(python scripts/release.py build dist)" >> "$GITHUB_OUTPUT"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          ZIP: ${{ steps.build.outputs.zip }}
        run: >-
          gh release create "$GITHUB_REF_NAME" "$ZIP"
          --repo "$GITHUB_REPOSITORY" --verify-tag
          --title "$GITHUB_REF_NAME" --generate-notes
